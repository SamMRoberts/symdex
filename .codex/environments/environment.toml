# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "symdex"

[setup]
script = ""

[setup.darwin]
script = "export SYMDEX_RUST_ANALYZER_CMD=rust-analyzer"

[[actions]]
name = "Doctor"
icon = "debug"
command = "cargo run -p symdex-cli -- doctor ."

[[actions]]
name = "Index Status"
icon = "debug"
command = "cargo run -p symdex-cli -- index-status ."

[[actions]]
name = "Staleness"
icon = "debug"
command = "cargo run -p symdex-cli -- staleness ."

[[actions]]
name = "Index: Full"
icon = "run"
command = "cargo run -p symdex-cli -- index --full ."

[[actions]]
name = "Index: Incremental"
icon = "run"
command = "cargo run -p symdex-cli -- index --incremental ."

[[actions]]
name = "Watch: Start"
icon = "tool"
command = "cargo run -p symdex-cli -- watch start ."

[[actions]]
name = "Watch: Stop"
icon = "tool"
command = "cargo run -p symdex-cli -- watch stop ."

[[actions]]
name = "Watch: Status"
icon = "tool"
command = "cargo run -p symdex-cli -- watch status ."

[[actions]]
name = "Build: Release"
icon = "tool"
command = '''
cargo fmt --all
cargo fmt --all --check
cargo clippy --workspace --all-targets -- -D warnings
cargo test --workspace
cargo build --workspace --release
'''

[[actions]]
name = "Test"
icon = "test"
command = '''
cargo fmt --all
cargo fmt --all --check
cargo clippy --workspace --all-targets -- -D warnings
cargo test --workspace
'''
