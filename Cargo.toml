[workspace]
members = [
    "crates/symdex-cli",
    "crates/symdex-core",
    "crates/symdex-diagnostics",
    "crates/symdex-embed",
    "crates/symdex-index",
    "crates/symdex-mcp",
    "crates/symdex-query",
    "crates/symdex-sqlite-vec",
    "crates/symdex-store",
    "crates/symdex-tui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/SamMRoberts/symdex"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
