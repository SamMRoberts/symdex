name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_macos:
        description: Build aarch64-apple-darwin
        type: boolean
        default: true
      build_windows:
        description: Build x86_64-pc-windows-msvc
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare-matrix:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Select targets
        id: matrix
        shell: bash
        run: |
          include='[]'

          add_target() {
            include="$(jq -c \
              --arg os "$1" \
              --arg target "$2" \
              --arg bin_ext "$3" \
              '. + [{ os: $os, target: $target, bin_ext: $bin_ext }]' \
              <<<"$include")"
          }

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.build_macos }}" = "true" ]; then
            add_target "macos-latest" "aarch64-apple-darwin" ""
          fi

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.build_windows }}" = "true" ]; then
            add_target "windows-latest" "x86_64-pc-windows-msvc" ".exe"
          fi

          if [ "$(jq length <<<"$include")" -eq 0 ]; then
            echo "::error::Select at least one release build target."
            exit 1
          fi

          echo "matrix=$(jq -c '{ include: . }' <<<"$include")" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare-matrix
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        if: matrix.os != 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (release, Windows optimized)
        if: matrix.os == 'windows-latest'
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_PANIC: abort
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          BIN_NAME="$(basename $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].targets[] | select(.kind[]=="bin") | .name'))"
          OUT_DIR="target/${{ matrix.target }}/release"

          mkdir -p dist

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "$OUT_DIR/$BIN_NAME${{ matrix.bin_ext }}" "dist/${BIN_NAME}-${{ matrix.target }}${{ matrix.bin_ext }}"
          else
            cp "$OUT_DIR/$BIN_NAME" "dist/${BIN_NAME}-${{ matrix.target }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*