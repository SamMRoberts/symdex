services:
  app:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - "/Users/samroberts/Repo/SamMRoberts/symdex/qdrant_storage:/qdrant/storage:z"
    networks:
      no_internet_net:
        ipv4_address: 172.30.0.10

networks:
  no_internet_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24